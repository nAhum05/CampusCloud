services:
  # ==============================
  # PostgreSQL
  # ==============================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================
  # SQL Server
  # ==============================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================
  # pgAdmin
  # ==============================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  # ==============================
  # Neo4j
  # ==============================
  neo4j:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - campuscloud_net

  # ==============================
  # MongoDB
  # ==============================
  mongo:
    image: mongo:8.0.8-noble
    container_name: campuscloud-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campuscloud_net

# ==============================
# VOLUMENES
# ==============================
volumes:
  postgres_data:
  pgadmin_data:
  sqlserver_data:
  neo4j_data:
  mongo_data:

# ==============================
# RED
# ==============================
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}