<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Docentes · CampusCloud</title>
  <style>
    :root { --accent: #16a34a; --accent-2: #14532d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 460px; text-align: center;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .icon { color: #fff; }
    h1 { font-size: 28px; margin: 16px 0 4px; }
    .brand { font-size: 14px; opacity: .85; letter-spacing: 2px; text-transform: uppercase; }
    .sub { margin-top: 18px; font-size: 15px; line-height: 1.6; opacity: .92; }
    .badge {
      display: inline-block; margin-top: 24px; padding: 8px 16px;
      background: rgba(0,0,0,0.25); border-radius: 999px;
      font-size: 14px; font-family: ui-monospace, monospace;
    }
    .meta { margin-top: 18px; font-size: 13px; opacity: .8; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Icono: pizarra / presentación (SVG incrustado) -->
    <svg class="icon" width="72" height="72" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h20"/>
      <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/>
      <path d="m7 21 5-5 5 5"/>
    </svg>
    <div class="brand">CampusCloud</div>
    <h1>Portal de Docentes</h1>
    <p class="sub">Aplicación 2 de la práctica. El mismo proxy inverso Nginx
       atendió la ruta <code>/app2/</code> y la reenvió a un contenedor
       distinto del anterior, también en la red interna de Docker.</p>
    <div class="badge">servido por el contenedor: <strong>app2</strong></div>
    <div class="meta">
      ruta: <span id="path">/</span><br>
      hora: <span id="clock">--:--:--</span>
    </div>
  </div>
  <script>
    document.getElementById('path').textContent = window.location.pathname;
    const tick = () => document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('es-MX');
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
