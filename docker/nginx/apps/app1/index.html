<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Estudiantes · CampusCloud</title>
  <style>
    :root { --accent: #2563eb; --accent-2: #1e3a8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 460px; text-align: center;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .icon { color: #fff; }
    h1 { font-size: 28px; margin: 16px 0 4px; }
    .brand { font-size: 14px; opacity: .85; letter-spacing: 2px; text-transform: uppercase; }
    .sub { margin-top: 18px; font-size: 15px; line-height: 1.6; opacity: .92; }
    .badge {
      display: inline-block; margin-top: 24px; padding: 8px 16px;
      background: rgba(0,0,0,0.25); border-radius: 999px;
      font-size: 14px; font-family: ui-monospace, monospace;
    }
    .meta { margin-top: 18px; font-size: 13px; opacity: .8; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Icono: birrete de graduación (SVG incrustado) -->
    <svg class="icon" width="72" height="72" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
      <path d="M22 10v6"/>
      <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
    </svg>
    <div class="brand">CampusCloud</div>
    <h1>Portal de Estudiantes</h1>
    <p class="sub">Aplicación 1 de la práctica. La solicitud a la ruta
       <code>/app1/</code> fue recibida por el proxy inverso Nginx y reenviada
       a este contenedor dentro de la red interna de Docker.</p>
    <div class="badge">servido por el contenedor: <strong>app1</strong></div>
    <div class="meta">
      ruta: <span id="path">/</span><br>
      hora: <span id="clock">--:--:--</span>
    </div>
  </div>
  <script>
    document.getElementById('path').textContent = window.location.pathname;
    const tick = () => document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('es-MX');
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
