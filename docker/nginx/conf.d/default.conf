# ============================================================
#  CampusCloud · Práctica: PROXY INVERSO con Nginx
#  Enrutamiento POR RUTA (path-based)
#
#  Un solo punto de entrada:  http://localhost:8080
#
#    http://localhost:8080/        -> portada con enlaces
#    http://localhost:8080/app1/   -> contenedor app1 (whoami)
#    http://localhost:8080/app2/   -> contenedor app2 (hello)
#
#  Las apps NO exponen puerto al host: solo se llega a ellas
#  pasando por este proxy, a través de la red interna de Docker.
# ============================================================

server {
    # Nginx escucha el puerto 80 DENTRO del contenedor.
    # En docker-composev6.yml el puerto del host 8080.
    listen 80;
    server_name localhost;

    # -------------------------------------------------------
    #  Portada
    #  Solo responde en la raíz exacta "/" (por eso el "= /").
    # -------------------------------------------------------
    location = / {
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusCloud · Proxy inverso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#334155 0%,#0f172a 100%);padding:24px}
.card{width:100%;max-width:560px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:40px 32px;text-align:center}
.brand{font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-top:14px}
h1{font-size:26px;margin:4px 0 16px}
p{font-size:15px;line-height:1.6;opacity:.92;text-align:left;max-width:460px;margin:0 auto}
ul{list-style:none;max-width:460px;margin:24px auto 0;padding:0}
li{margin:10px 0}
a{color:#fff;text-decoration:none;display:block;padding:12px 16px;background:rgba(0,0,0,.25);border-radius:10px}
a:hover{background:rgba(0,0,0,.4)}
code{font-family:ui-monospace,monospace}
</style></head>
<body><div class="card">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
<div class="brand">CampusCloud</div>
<h1>Proxy inverso con Nginx</h1>
<p>Nginx funciona como proxy inverso: es el único punto de entrada expuesto (puerto 8080). Cuando el navegador solicita una ruta, Nginx la reenvía al contenedor correspondiente a través de la red interna de Docker y devuelve su respuesta. Las aplicaciones no publican puertos propios; solo se puede acceder a ellas por medio de este proxy.</p>
<ul>
<li><a href="/app1/"><code>/app1/</code> &rarr; Portal de Estudiantes (contenedor app1)</a></li>
<li><a href="/app2/"><code>/app2/</code> &rarr; Portal de Docentes (contenedor app2)</a></li>
</ul>
</div></body></html>';
    }

    # -------------------------------------------------------
    #  APP 1
    #
    #  proxy_pass con "/" final  ->  Nginx QUITA el prefijo /app1/
    #  antes de reenviar. El backend recibe "/" y responde normal.
    #
    #    navegador pide:  /app1/foo
    #    app1 recibe:     /foo
    #
    #  "app1" es el nombre del servicio en el compose; Docker lo
    #  resuelve como nombre de host dentro de la red interna.
    # -------------------------------------------------------
    location /app1/ {
        # DNS interno de Docker. Al usar una VARIABLE en proxy_pass,
        # Nginx vuelve a resolver el nombre en cada petición (no cachea
        # la IP al arrancar) -> sobrevive a recrear los contenedores.
        resolver 127.0.0.11 valid=10s;
        set $app1_upstream http://app1:80;

        # Quitamos el prefijo /app1/ antes de reenviar:  /app1/foo -> /foo
        rewrite ^/app1/(.*)$ /$1 break;
        proxy_pass $app1_upstream;

        # Cabeceras que el proxy añade para que el backend sepa
        # quién hizo la petición original (buen tema para explicar
        # qué aporta un proxy inverso).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    #  APP 2  (misma idea que app1)
    # -------------------------------------------------------
    location /app2/ {
        resolver 127.0.0.11 valid=10s;
        set $app2_upstream http://app2:80;

        rewrite ^/app2/(.*)$ /$1 break;
        proxy_pass $app2_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
